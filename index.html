<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Weather Sentinel Safe</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000; --card: #121212; --accent: #3b82f6; --text: #fff; --dim: #888; --danger: #ff3b3b; --border: rgba(255,255,255,0.1); }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 20px 20px 40px; }
        
        #loader { position: fixed; top: 0; left: 0; height: 3px; background: var(--accent); z-index: 10000; width: 0%; transition: width 0.3s; }

        /* Header & Search */
        header { margin-bottom: 20px; }
        .search-group { display: flex; gap: 8px; margin-bottom: 15px; }
        #search-input { flex: 1; background: var(--card); border: 1px solid var(--border); padding: 14px; border-radius: 18px; color: #fff; }
        .btn-gps { background: var(--card); border: 1px solid var(--border); width: 50px; border-radius: 18px; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }

        /* Fallback UI (Nascosta di default) */
        #fallback-ui { display: none; text-align: center; padding: 20px; background: #111; border-radius: 20px; border: 1px solid var(--danger); margin-bottom: 20px; }

        /* Hero */
        .hero { text-align: center; padding: 20px 0; }
        .city-name { font-size: 1.4rem; font-weight: 800; }
        .temp-main { font-size: 5.5rem; font-weight: 800; line-height: 1; letter-spacing: -4px; margin: 10px 0; }
        .condition { color: var(--accent); font-weight: 700; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; }
        .main-icon { width: 120px; height: 120px; margin: 0 auto; display: block; filter: invert(1) brightness(1.5); }

        /* Grid Dati */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 18px; border-radius: 24px; }
        .card .label { font-size: 0.6rem; color: var(--dim); text-transform: uppercase; font-weight: 700; margin-bottom: 5px; display: block; }
        .card .val { font-size: 1.6rem; font-weight: 800; }

        /* Scroller */
        .scroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; margin-top: 20px; scrollbar-width: none; }
        .scroll::-webkit-scrollbar { display: none; }
        .tile { flex: 0 0 90px; background: var(--card); border: 1px solid var(--border); padding: 15px 10px; border-radius: 20px; text-align: center; }
        .tile img { width: 25px; filter: invert(1); margin: 5px 0; }
        
        .alert-bar { display: none; background: rgba(255, 59, 59, 0.15); border: 1px solid var(--danger); color: var(--danger); padding: 12px; border-radius: 15px; margin: 10px 0; text-align: center; font-weight: 800; font-size: 0.7rem; }
    </style>
</head>
<body>

<div id="loader"></div>

<header>
    <div class="search-group">
        <input type="text" id="search-input" placeholder="Scrivi una città..." autocomplete="off">
        <button class="btn-gps" onclick="getLocation(true)">📍</button>
    </div>
</header>

<div id="fallback-ui">
    <p style="font-size: 0.8rem; margin-bottom: 10px;">Il GPS non risponde o è bloccato.</p>
    <button onclick="location.reload()" style="background:var(--accent); color:white; border:none; padding:8px 15px; border-radius:10px; font-weight:bold;">RIPROVA</button>
</div>

<div id="hail-alert" class="alert-bar">⚠️ ALLERTA GRANDINE RILEVATA</div>

<main class="hero" id="main-content">
    <div class="city-name" id="city">Rilevamento...</div>
    <img id="m-icon" src="" class="main-icon">
    <div class="temp-main"><span id="hero-t">--</span>°</div>
    <div class="condition" id="hero-desc">Sincronizzazione...</div>
</main>

<div class="grid">
    <div class="card"><span class="label">Percepita</span><div class="val"><span id="c-feels">--</span>°</div></div>
    <div class="card"><span class="label">Pioggia</span><div class="val"><span id="c-rain">--</span>%</div></div>
    <div class="card"><span class="label">Umidità</span><div class="val"><span id="c-hum">--</span>%</div></div>
    <div class="card"><span class="label">Indice UV</span><div class="val" id="c-uv">--</div></div>
</div>

<section style="margin-top: 30px;">
    <h3 style="font-size: 0.7rem; color: var(--dim); text-transform: uppercase; margin-bottom: 10px;">Prossime Ore</h3>
    <div class="scroll" id="h-row"></div>
</section>

<script>
    const weatherMap = { 
        0: ["Sereno", "sun"], 1: ["Quasi Sereno", "cloud-sun"], 2: ["Nuvole", "cloud"], 3: ["Coperto", "cloud"], 
        45: ["Nebbia", "cloud-fog"], 61: ["Pioggia", "cloud-rain"], 65: ["Forte Pioggia", "cloud-showers-heavy"], 
        95: ["Temporale", "cloud-lightning"], 27: ["Grandine", "cloud-hail"], 87: ["Grandine", "cloud-hail"], 99: ["Grandine", "cloud-hail"] 
    };

    async function init() {
        document.getElementById('loader').style.width = '30%';
        
        // 1. Prova a caricare l'ultima posizione salvata (per velocità massima)
        const lastPos = JSON.parse(localStorage.getItem('last_weather_pos'));
        if (lastPos) {
            fetchWeather(lastPos.lat, lastPos.lon, lastPos.name);
        }

        getLocation();
    }

    async function getLocation(forceGPS = false) {
        // Plan A: IP Location (Sempre veloce)
        try {
            const ipRes = await fetch('https://get.geojs.io/v1/ip/geo.json');
            const ipData = await ipRes.json();
            fetchWeather(ipData.latitude, ipData.longitude, ipData.city);
        } catch (e) { console.log("IP fallito"); }

        // Plan B: GPS con Timeout
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (p) => {
                    fetchWeather(p.coords.latitude, p.coords.longitude, "Tua Posizione");
                    document.getElementById('fallback-ui').style.display = 'none';
                },
                (err) => { 
                    if(forceGPS) document.getElementById('fallback-ui').style.display = 'block';
                },
                { enableHighAccuracy: true, timeout: 6000 } // Aspetta max 6 secondi
            );
        }
    }

    async function fetchWeather(lat, lon, name) {
        try {
            const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,precipitation_probability,relative_humidity_2m,uv_index,weather_code&hourly=temperature_2m,weather_code&timezone=auto`);
            const data = await res.json();
            
            // Salva posizione attuale per il prossimo avvio
            localStorage.setItem('last_weather_pos', JSON.stringify({lat, lon, name}));
            
            render(data, name);
        } catch (e) { console.log("Errore API"); }
    }

    function render(data, name) {
        const cur = data.current;
        document.getElementById('city').innerText = name;
        document.getElementById('hero-t').innerText = Math.round(cur.temperature_2m);
        document.getElementById('c-feels').innerText = Math.round(cur.apparent_temperature);
        document.getElementById('c-rain').innerText = cur.precipitation_probability;
        document.getElementById('c-hum').innerText = cur.relative_humidity_2m;
        document.getElementById('c-uv').innerText = cur.uv_index;

        const info = weatherMap[cur.weather_code] || ["Nuvoloso", "cloud"];
        document.getElementById('hero-desc').innerText = info[0];
        document.getElementById('m-icon').src = `https://raw.githubusercontent.com/lucide-icons/lucide/main/icons/${info[1]}.svg`;
        
        // Allerta Grandine
        document.getElementById('hail-alert').style.display = [27, 87, 99].includes(cur.weather_code) ? 'block' : 'none';

        // Forecast
        const hRow = document.getElementById('h-row'); hRow.innerHTML = '';
        const now = new Date().getHours();
        for(let i=1; i<=8; i++) {
            const idx = now + i;
            const code = data.hourly.weather_code[idx];
            const ic = weatherMap[code] ? weatherMap[code][1] : "cloud";
            hRow.innerHTML += `<div class="tile">
                <div class="t-time">${idx%24}:00</div>
                <img src="https://raw.githubusercontent.com/lucide-icons/lucide/main/icons/${ic}.svg">
                <div style="font-weight:700">${Math.round(data.hourly.temperature_2m[idx])}°</div>
            </div>`;
        }
        
        document.getElementById('loader').style.width = '100%';
        setTimeout(() => document.getElementById('loader').style.width = '0', 400);
    }

    // Ricerca Manuale (Se il GPS fallisce, l'utente può scrivere)
    document.getElementById('search-input').addEventListener('keypress', async (e) => {
        if (e.key === 'Enter') {
            const val = e.target.value;
            const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(val)}&count=1&language=it`);
            const data = await res.json();
            if(data.results) {
                const c = data.results[0];
                fetchWeather(c.latitude, c.longitude, c.name);
                document.getElementById('fallback-ui').style.display = 'none';
            }
        }
    });

    window.onload = init;
</script>
</body>
</html>
