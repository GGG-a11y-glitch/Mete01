<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Honor Weather Intelligence Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #000; --card: #111; --accent: #3b82f6; --text: #fff; --dim: #777; 
            --border: rgba(255,255,255,0.08); --safe: #00e676; --warning: #facc15; --danger: #ff3b3b; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: env(safe-area-inset-top) 15px 40px 15px; }
        
        #loader { position: fixed; top: 0; left: 0; height: 3px; background: var(--accent); z-index: 10000; transition: width 0.4s; }

        /* Ricerca e Suggerimenti */
        header { margin-bottom: 25px; position: relative; }
        .search-row { display: flex; gap: 10px; margin-bottom: 15px; }
        #search-input { flex: 1; background: var(--card); border: 1px solid var(--border); padding: 14px; border-radius: 18px; color: #fff; font-size: 0.9rem; }
        #search-results { 
            position: absolute; top: 60px; left: 0; width: calc(100% - 60px); 
            background: #1a1a1a; border-radius: 15px; z-index: 5000; display: none; 
            border: 1px solid #333; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .search-item { padding: 12px; border-bottom: 1px solid #333; cursor: pointer; font-size: 0.85rem; }

        /* Clock & Location Module */
        .info-tile { background: linear-gradient(135deg, #111, #000); border: 1px solid var(--border); padding: 20px; border-radius: 26px; margin-bottom: 20px; }
        .info-header { display: flex; justify-content: space-between; align-items: flex-end; }
        .city-name { font-size: 1.2rem; font-weight: 800; color: var(--text); }
        .local-time { font-size: 2.2rem; font-weight: 800; color: var(--accent); }
        .home-info { font-size: 0.7rem; color: var(--dim); text-transform: uppercase; margin-top: 8px; border-top: 1px solid #222; padding-top: 8px; }

        /* Main Metrics Grid */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 18px; border-radius: 22px; cursor: help; }
        .card .label { font-size: 0.6rem; color: var(--dim); text-transform: uppercase; font-weight: 700; margin-bottom: 5px; display: block; }
        .card .val { font-size: 1.7rem; font-weight: 800; }
        .card .comp { font-size: 0.65rem; color: var(--accent); margin-top: 5px; font-weight: 600; }

        /* Advisor & Insight */
        .advice-box { background: rgba(59, 130, 246, 0.05); border: 1px solid var(--accent); padding: 18px; border-radius: 24px; margin-bottom: 20px; display: flex; gap: 15px; align-items: center; }
        .insight-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .insight-card { background: #080808; border: 1px solid var(--border); padding: 12px; border-radius: 18px; }

        /* Forecast Scroller */
        section h2 { font-size: 0.75rem; color: var(--dim); text-transform: uppercase; margin: 0 0 12px 5px; letter-spacing: 1px; }
        .scroll-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
        .scroll-row::-webkit-scrollbar { display: none; }
        .tile { flex: 0 0 100px; background: var(--card); border: 1px solid var(--border); padding: 15px 10px; border-radius: 20px; text-align: center; cursor: pointer; transition: 0.2s; }
        .tile.active { border-color: var(--accent); background: rgba(59, 130, 246, 0.1); }
        .t-head { font-size: 0.65rem; color: var(--dim); margin-bottom: 5px; }

        /* Modals */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); display: none; align-items: center; justify-content: center; z-index: 10001; padding: 25px; }
        .modal-content { background: #111; border: 1px solid #333; border-radius: 30px; padding: 35px; width: 100%; max-width: 400px; text-align: center; position: relative; }
        .m-close { position: absolute; top: 15px; right: 15px; background: #222; border: none; color: #fff; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; }
    </style>
</head>
<body>

<div id="loader" style="width: 0%"></div>

<header>
    <div class="search-row">
        <input type="text" id="search-input" placeholder="Cerca città..." autocomplete="off">
        <button class="btn-gps" onclick="initGPS()" style="background:var(--card); border:1px solid var(--border); width:50px; border-radius:18px; color:white; font-size:1.2rem;">📍</button>
    </div>
    <div id="search-results"></div>

    <div class="info-tile">
        <div class="info-header">
            <div>
                <b id="loc-status" style="font-size: 0.6rem; color: var(--accent); text-transform: uppercase;">Posizione Attuale</b>
                <div class="city-name" id="city-name">Caricamento...</div>
            </div>
            <div class="local-time" id="local-time">00:00</div>
        </div>
        <div class="home-info" id="home-comparison">In Italia: --:--</div>
    </div>
</header>

<main class="grid">
    <div class="card" onclick="explain('temp')"><span class="label">Temperatura</span><div class="val"><span id="c-temp">--</span>°</div><div class="comp" id="comp-temp"></div></div>
    <div class="card" onclick="explain('feels')"><span class="label">Percepita</span><div class="val"><span id="c-feels">--</span>°</div><div class="comp" id="comp-feels"></div></div>
    <div class="card" onclick="explain('rain')"><span class="label">Pioggia</span><div class="val"><span id="c-rain">--</span>%</div><div class="comp" id="comp-rain"></div></div>
    <div class="card" onclick="explain('hum')"><span class="label">Umidità</span><div class="val"><span id="c-hum">--</span>%</div><div class="comp" id="comp-hum"></div></div>
</main>

<div class="advice-box">
    <div id="adv-icon" style="font-size: 1.8rem;">🧥</div>
    <div style="font-size: 0.85rem; line-height: 1.4;" id="adv-text">Analisi meteo in corso...</div>
</div>

<section>
    <h2>Dettaglio Prossime 5 Ore</h2>
    <div class="scroll-row" id="h-row"></div>
</section>

<section>
    <h2>Previsione 7 Giorni</h2>
    <div class="scroll-row" id="d-row"></div>
</section>

<section>
    <h2>Insight Avanzati</h2>
    <div class="insight-grid">
        <div class="insight-card"><span class="label" style="font-size:0.5rem; color:var(--dim)">VENTO MAX</span><div id="i-wind" style="font-size:0.9rem; font-weight:700; margin-top:3px;">--</div></div>
        <div class="insight-card"><span class="label" style="font-size:0.5rem; color:var(--dim)">INDICE UV</span><div id="i-uv" style="font-size:0.9rem; font-weight:700; margin-top:3px;">--</div></div>
        <div class="insight-card"><span class="label" style="font-size:0.5rem; color:var(--dim)">VISIBILITÀ</span><div id="i-vis" style="font-size:0.9rem; font-weight:700; margin-top:3px;">--</div></div>
        <div class="insight-card"><span class="label" style="font-size:0.5rem; color:var(--dim)">COPERTURA</span><div id="i-cloud" style="font-size:0.9rem; font-weight:700; margin-top:3px;">--</div></div>
    </div>
</section>

<div id="modal" class="modal" onclick="this.style.display='none'">
    <div class="modal-content" onclick="event.stopPropagation()">
        <button class="m-close" onclick="document.getElementById('modal').style.display='none'">✕</button>
        <h3 id="m-title" style="color:var(--accent); margin-bottom:15px; text-transform:uppercase;">INFO</h3>
        <p id="m-text" style="color:#ccc; line-height:1.6;"></p>
    </div>
</div>

<script>
    let homeData = null;
    let activeData = null;
    let clockTimer = null;

    // --- LOGICA RICERCA ---
    const searchInput = document.getElementById('search-input');
    const resultsBox = document.getElementById('search-results');

    searchInput.addEventListener('input', async () => {
        const q = searchInput.value;
        if (q.length < 3) { resultsBox.style.display = 'none'; return; }
        const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=5&language=it`);
        const data = await res.json();
        if (data.results) {
            resultsBox.innerHTML = data.results.map(r => `<div class="search-item" onclick="selectCity(${r.latitude}, ${r.longitude}, '${r.name}', '${r.timezone}')">${r.name} (${r.country})</div>`).join('');
            resultsBox.style.display = 'block';
        }
    });

    async function selectCity(lat, lon, name, tz) {
        resultsBox.style.display = 'none';
        searchInput.value = '';
        document.getElementById('loc-status').innerText = "Città Selezionata";
        fetchWeather(lat, lon, name, tz, false);
    }

    async function initGPS() {
        navigator.geolocation.getCurrentPosition(p => {
            fetchWeather(p.coords.latitude, p.coords.longitude, "Casa", "auto", true);
        });
    }

    // --- LOGICA METEO ---
    async function fetchWeather(lat, lon, name, tz, isHome) {
        const ld = document.getElementById('loader'); ld.style.width = '40%';
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,precipitation_probability,relative_humidity_2m,uv_index,wind_speed_10m,visibility,cloud_cover&hourly=temperature_2m,apparent_temperature,precipitation_probability,relative_humidity_2m,uv_index&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max&timezone=${encodeURIComponent(tz)}`);
        const data = await res.json();
        
        if (isHome) { homeData = data; document.getElementById('loc-status').innerText = "📍 Posizione GPS (Casa)"; }
        activeData = data;
        
        renderUI(name);
        ld.style.width = '100%'; setTimeout(() => ld.style.width = '0', 500);
    }

    function renderUI(name) {
        document.getElementById('city-name').innerText = name;
        const c = activeData.current;
        
        document.getElementById('c-temp').innerText = Math.round(c.temperature_2m);
        document.getElementById('c-feels').innerText = Math.round(c.apparent_temperature);
        document.getElementById('c-rain').innerText = c.precipitation_probability;
        document.getElementById('c-hum').innerText = c.relative_humidity_2m;
        document.getElementById('i-wind').innerText = Math.round(c.wind_speed_10m) + " km/h";
        document.getElementById('i-uv').innerText = c.uv_index.toFixed(1);
        document.getElementById('i-vis').innerText = (c.visibility / 1000).toFixed(0) + " km";
        document.getElementById('i-cloud').innerText = c.cloud_cover + "%";

        // Confronto con Casa
        if (homeData && name !== "Casa") {
            document.getElementById('comp-temp').innerText = `Casa: ${Math.round(homeData.current.temperature_2m)}°`;
            document.getElementById('comp-rain').innerText = `Casa: ${homeData.current.precipitation_probability}%`;
        } else {
            document.getElementById('comp-temp').innerText = "";
            document.getElementById('comp-rain').innerText = "";
        }

        updateClock(activeData.timezone);
        updateAdvice(c);
        renderForecasts();
    }

    function renderForecasts() {
        const hRow = document.getElementById('h-row'); hRow.innerHTML = '';
        const dRow = document.getElementById('d-row'); dRow.innerHTML = '';
        const nowH = new Date().getHours();

        for(let i=1; i<=5; i++) {
            const idx = nowH + i;
            hRow.innerHTML += `<div class="tile" onclick="setDetailedView('h', ${idx})"><div class="t-head">${idx%24}:00</div><div style="font-weight:700">${Math.round(activeData.hourly.temperature_2m[idx])}°</div></div>`;
        }

        const days = ['Domani', 'Dopodomani', 'Fra 3gg', 'Fra 4gg', 'Fra 5gg', 'Fra 6gg'];
        for(let i=1; i<=6; i++) {
            dRow.innerHTML += `<div class="tile" onclick="setDetailedView('d', ${i})"><div class="t-head">${days[i-1]}</div><div style="font-weight:700">${Math.round(activeData.daily.temperature_2m_max[i])}°</div></div>`;
        }
    }

    function setDetailedView(type, idx) {
        if(type === 'h') {
            const h = activeData.hourly;
            document.getElementById('c-temp').innerText = Math.round(h.temperature_2m[idx]);
            document.getElementById('c-feels').innerText = Math.round(h.apparent_temperature[idx]);
            document.getElementById('c-rain').innerText = h.precipitation_probability[idx];
            document.getElementById('c-hum').innerText = h.relative_humidity_2m[idx];
        } else {
            const d = activeData.daily;
            document.getElementById('c-temp').innerText = Math.round(d.temperature_2m_max[idx]);
            document.getElementById('c-rain').innerText = d.precipitation_probability_max[idx];
        }
    }

    function updateAdvice(c) {
        let text = "Mite. Abbigliamento leggero."; let icon = "👕";
        if (c.temperature_2m > 26) { text = "Caldo. Vestiti molto leggeri e bevi acqua."; icon = "🩳"; }
        if (c.temperature_2m < 15) { text = "Fresco. Meglio una giacca o felpa."; icon = "🧥"; }
        if (c.precipitation_probability > 40) text += " Ombrello consigliato.";
        document.getElementById('adv-text').innerText = text;
        document.getElementById('adv-icon').innerText = icon;
    }

    function updateClock(tz) {
        if(clockTimer) clearInterval(clockTimer);
        clockTimer = setInterval(() => {
            const n = new Date();
            document.getElementById('local-time').innerText = n.toLocaleTimeString('it-IT', {timeZone: tz, hour:'2-digit', minute:'2-digit'});
            document.getElementById('home-comparison').innerText = "In Italia: " + n.toLocaleTimeString('it-IT', {timeZone:'Europe/Rome', hour:'2-digit', minute:'2-digit'});
        }, 1000);
    }

    function explain(k) {
        const exp = { temp: "Temperatura reale dell'aria.", feels: "Temperatura avvertita (vento+umidità).", rain: "Probabilità pioggia.", hum: "Vapore acqueo nell'aria." };
        document.getElementById('m-title').innerText = k.toUpperCase();
        document.getElementById('m-text').innerText = exp[k];
        document.getElementById('modal').style.display = 'flex';
    }

    window.onload = initGPS;
</script>
</body>
</html>
