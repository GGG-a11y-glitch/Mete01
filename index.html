<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>Meteo Honor Pro</title>
    <style>
        :root { --bg: #000; --card: #121212; --accent: #3b82f6; --text: #fff; --dim: #888; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
        #app { width: 100%; max-width: 450px; }
        
        /* Header & Posizione */
        header { margin-bottom: 25px; }
        .pos-label { font-size: 0.7rem; color: var(--accent); font-weight: bold; text-transform: uppercase; }
        #address { font-size: 0.9rem; line-height: 1.4; margin-top: 5px; color: var(--text); }

        /* Grid Principale 2x2 */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px; }
        .card { background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid #222; text-align: center; }
        .card .label { display: block; font-size: 0.65rem; color: var(--dim); text-transform: uppercase; margin-bottom: 8px; }
        .card .val { font-size: 1.8rem; font-weight: bold; }
        .card .unit { font-size: 0.9rem; color: var(--dim); margin-left: 3px; }

        /* Previsioni 3 Ore */
        .forecast-title { font-size: 0.8rem; color: var(--dim); margin-bottom: 10px; text-transform: uppercase; padding-left: 5px; }
        .forecast-row { display: flex; gap: 10px; }
        .f-item { flex: 1; background: #0a0a0a; padding: 12px; border-radius: 15px; text-align: center; border: 1px solid #1a1a1a; }
        .f-time { font-size: 0.7rem; color: var(--dim); margin-bottom: 5px; }
        .f-temp { font-size: 1rem; font-weight: bold; }
        .f-rain { font-size: 0.7rem; color: var(--accent); margin-top: 4px; }

        #refresh-btn { width: 100%; padding: 15px; background: var(--card); border: 1px solid #333; color: var(--dim); border-radius: 15px; margin-top: 20px; cursor: pointer; }
        .loading { opacity: 0.5; pointer-events: none; }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <div class="pos-label">Posizione Rilevata</div>
            <div id="address">Ricerca posizione in corso...</div>
        </header>

        <main class="grid">
            <div class="card"><span class="label">Reale</span><div class="val"><span id="temp">--</span><span class="unit">°C</span></div></div>
            <div class="card"><span class="label">Pioggia</span><div class="val"><span id="rain">--</span><span class="unit">%</span></div></div>
            <div class="card"><span class="label">Percepita</span><div class="val"><span id="feels">--</span><span class="unit">°C</span></div></div>
            <div class="card"><span class="label">Indice UV</span><div class="val" id="uv">--</div></div>
        </main>

        <div class="forecast-title">Prossime 3 ore</div>
        <div class="forecast-row" id="forecast">
            <div class="f-item">--</div><div class="f-item">--</div><div class="f-item">--</div>
        </div>

        <button id="refresh-btn">Aggiorna Dati</button>
    </div>

    <script>
        async function fetchAll() {
            document.body.classList.add('loading');
            navigator.geolocation.getCurrentPosition(async (pos) => {
                const { latitude: lat, longitude: lon } = pos.coords;
                
                // 1. Indirizzo (Nominatim)
                try {
                    const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`, {
                        headers: { 'User-Agent': 'HonorWeatherApp/1.0' }
                    });
                    const geoData = await geoRes.json();
                    const a = geoData.address;
                    document.getElementById('address').innerHTML = `
                        ${a.road || 'Via non rilevata'}${a.house_number ? ', ' + a.house_number : ''}<br>
                        ${a.postcode || ''} ${a.city || a.town || a.village || ''}, ${a.country || ''}
                    `;
                } catch(e) { document.getElementById('address').innerText = "Errore indirizzo"; }

                // 2. Meteo + Previsioni (Open-Meteo)
                try {
                    const metRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,precipitation_probability,uv_index&hourly=temperature_2m,precipitation_probability&timezone=auto`);
                    const metData = await metRes.json();
                    
                    // Corrente
                    document.getElementById('temp').innerText = Math.round(metData.current.temperature_2m);
                    document.getElementById('feels').innerText = Math.round(metData.current.apparent_temperature);
                    document.getElementById('rain').innerText = metData.current.precipitation_probability;
                    document.getElementById('uv').innerText = metData.current.uv_index;

                    // Forecast 3h
                    const nowHour = new Date().getHours();
                    let fHTML = '';
                    for(let i=1; i<=3; i++) {
                        const hIdx = nowHour + i;
                        fHTML += `
                            <div class="f-item">
                                <div class="f-time">+${i}h</div>
                                <div class="f-temp">${Math.round(metData.hourly.temperature_2m[hIdx])}°</div>
                                <div class="f-rain">💧${metData.hourly.precipitation_probability[hIdx]}%</div>
                            </div>
                        `;
                    }
                    document.getElementById('forecast').innerHTML = fHTML;
                } catch(e) { alert("Errore meteo"); }
                
                document.body.classList.remove('loading');
            }, (err) => {
                document.getElementById('address').innerText = "GPS disattivato o negato.";
                document.body.classList.remove('loading');
            });
        }

        // Auto-refresh ogni volta che la pagina torna visibile (es. sblocchi telefono)
        document.addEventListener("visibilitychange", () => { if (!document.hidden) fetchAll(); });
        document.getElementById('refresh-btn').onclick = fetchAll;
        window.onload = fetchAll;
    </script>
</body>
</html>
