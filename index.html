<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>Honor Weather Elite</title>
    <style>
        :root { --bg: #000; --card: #111; --accent: #3b82f6; --danger: #ef4444; --safe: #10b981; --text: #fff; --dim: #777; }
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; padding: 15px; line-height: 1.4; }
        
        /* Header compatto */
        header { margin-bottom: 20px; border-bottom: 1px solid #222; padding-bottom: 10px; }
        .addr-line { font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
        .addr-line b { color: var(--accent); text-transform: uppercase; font-size: 0.7rem; margin-right: 5px; }

        /* Grid Principale */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .card { background: var(--card); padding: 15px; border-radius: 18px; border: 1px solid #222; position: relative; }
        .card .label { font-size: 0.65rem; color: var(--dim); text-transform: uppercase; display: block; margin-bottom: 5px; }
        .card .val { font-size: 1.6rem; font-weight: 700; }
        .card .unit { font-size: 0.8rem; color: var(--dim); margin-left: 2px; }
        .card .note { font-size: 0.65rem; margin-top: 8px; color: var(--accent); font-weight: 500; }

        /* Sezioni Forecast */
        section { margin-bottom: 20px; }
        h2 { font-size: 0.75rem; color: var(--dim); text-transform: uppercase; margin-bottom: 10px; letter-spacing: 1px; }
        .scroll-row { display: flex; gap: 8px; }
        .tile { flex: 1; background: var(--card); padding: 12px 8px; border-radius: 15px; text-align: center; border: 1px solid #1a1a1a; min-width: 80px; }
        .tile .t-head { font-size: 0.65rem; color: var(--dim); margin-bottom: 5px; }
        .tile .t-val { font-size: 0.9rem; font-weight: bold; }
        .tile .t-sub { font-size: 0.6rem; color: var(--accent); margin-top: 3px; }

        /* Eventi Speciali */
        .event-card { background: linear-gradient(145deg, #111, #050505); border: 1px solid #333; padding: 15px; border-radius: 18px; display: flex; justify-content: space-around; }
        .event-item { text-align: center; }
        .event-item .e-label { font-size: 0.6rem; color: var(--dim); text-transform: uppercase; }
        .event-item .e-val { font-size: 1rem; font-weight: bold; color: #facc15; }

        .danger-text { color: var(--danger) !important; }
        .loading { opacity: 0.3; }
    </style>
</head>
<body>

    <header>
        <div class="addr-line" id="full-address"><b>Posizione rilevata:</b> Ricerca in corso...</div>
    </header>

    <main class="grid">
        <!-- Temp & Percepita -->
        <div class="card">
            <span class="label">Temperatura</span>
            <div class="val"><span id="temp">--</span><span class="unit">°C</span></div>
        </div>
        <div class="card">
            <span class="label">Temperatura Percepita</span>
            <div class="val"><span id="feels">--</span><span class="unit">°C</span></div>
        </div>

        <!-- Pioggia & UV -->
        <div class="card">
            <span class="label">Prob. Pioggia</span>
            <div class="val"><span id="rain">--</span><span class="unit">%</span></div>
        </div>
        <div class="card">
            <span class="label">Indice UV</span>
            <div class="val" id="uv">--</div>
            <div id="uv-note" class="note">Calcolo esposizione...</div>
        </div>
    </main>

    <section>
        <h2>Prossime 3 Ore</h2>
        <div class="scroll-row" id="hourly-forecast">
            <!-- Tiles orarie -->
        </div>
    </section>

    <section>
        <h2>Prossimi 3 Giorni</h2>
        <div class="scroll-row" id="daily-forecast">
            <!-- Tiles giornaliere -->
        </div>
    </section>

    <section>
        <h2>Eventi previsti a breve</h2>
        <div class="event-card">
            <div class="event-item">
                <div class="e-label">Grandine (Stima)</div>
                <div class="e-val" id="hail-prob">--</div>
            </div>
            <div class="event-item" style="border-left: 1px solid #222; padding-left: 15px;">
                <div class="e-label">Vento (Raffiche)</div>
                <div class="e-val" id="wind-speed">--</div>
            </div>
        </div>
    </section>

    <script>
        const API_URL = "https://api.open-meteo.com/v1/forecast";

        async function updateWeather() {
            document.body.classList.add('loading');
            
            navigator.geolocation.getCurrentPosition(async (pos) => {
                const { latitude: lat, longitude: lon } = pos.coords;

                try {
                    // 1. Reverse Geocoding per indirizzo in riga singola
                    const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                    const geoData = await geoRes.json();
                    const a = geoData.address;
                    const addrStr = `${a.road || ''} ${a.house_number || ''}, ${a.postcode || ''} ${a.city || a.town || ''} (${a.country || ''})`;
                    document.getElementById('full-address').innerHTML = `<b>Posizione rilevata:</b> ${addrStr}`;

                    // 2. Dati Meteo Completi
                    const weatherRes = await fetch(`${API_URL}?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,precipitation_probability,uv_index,wind_speed_10m,weather_code&hourly=temperature_2m,precipitation_probability,wind_gusts_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto`);
                    const data = await weatherRes.json();

                    // UI Corrente
                    document.getElementById('temp').innerText = Math.round(data.current.temperature_2m);
                    document.getElementById('feels').innerText = Math.round(data.current.apparent_temperature);
                    document.getElementById('rain').innerText = data.current.precipitation_probability;
                    
                    // Logica UV
                    const uv = data.current.uv_index;
                    document.getElementById('uv').innerText = uv.toFixed(1);
                    const uvNote = document.getElementById('uv-note');
                    if (uv >= 6) {
                        const mins = Math.round(200 / uv); 
                        uvNote.innerHTML = `<span class="danger-text">DANNOSO: Max ${mins} min sole</span>`;
                    } else {
                        uvNote.innerHTML = `<span style="color:var(--safe)">SICURO: Esposizione libera</span>`;
                    }

                    // Forecast 3 Ore
                    let hHTML = '';
                    const startH = new Date().getHours() + 1;
                    for(let i=0; i<3; i++) {
                        hHTML += `
                            <div class="tile">
                                <div class="t-head">${startH + i}:00</div>
                                <div class="t-val">${Math.round(data.hourly.temperature_2m[startH+i])}°</div>
                                <div class="t-sub">💧${data.hourly.precipitation_probability[startH+i]}%</div>
                            </div>
                        `;
                    }
                    document.getElementById('hourly-forecast').innerHTML = hHTML;

                    // Forecast 3 Giorni
                    let dHTML = '';
                    const days = ['Oggi', 'Domani', 'Dopodomani'];
                    for(let i=0; i<3; i++) {
                        dHTML += `
                            <div class="tile">
                                <div class="t-head">${days[i]}</div>
                                <div class="t-val">${Math.round(data.daily.temperature_2m_max[i])}°</div>
                                <div class="t-sub">💧${data.daily.precipitation_probability_max[i]}%</div>
                            </div>
                        `;
                    }
                    document.getElementById('daily-forecast').innerHTML = dHTML;

                    // Eventi Speciali (Grandine e Vento)
                    // Nota: La grandine è stimata basandosi su codice meteo (WMO) e probabilità pioggia > 70%
                    const isHailPossible = [27, 87, 88, 89, 90, 99].includes(data.current.weather_code);
                    document.getElementById('hail-prob').innerText = isHailPossible ? "ALTA (70%+)" : "Bassa (<5%)";
                    
                    const maxWind = Math.max(...data.hourly.wind_gusts_10m.slice(0, 24));
                    document.getElementById('wind-speed').innerText = `${Math.round(maxWind)} km/h`;

                } catch (e) {
                    console.error(e);
                } finally {
                    document.body.classList.remove('loading');
                }
            }, () => {
                document.getElementById('full-address').innerText = "Attivare GPS e ricaricare.";
                document.body.classList.remove('loading');
            });
        }

        // Auto-refresh ogni 10 min o quando si riapre l'app
        setInterval(updateWeather, 600000);
        document.addEventListener("visibilitychange", () => { if (!document.hidden) updateWeather(); });
        window.onload = updateWeather;
    </script>
</body>
</html>
