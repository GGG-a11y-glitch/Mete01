<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Honor Weather World</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000; --card: #121212; --accent: #3b82f6; --text: #fff; --dim: #888; --border: rgba(255,255,255,0.1); --danger: #ff4b4b; --safe: #00e676; --warning: #facc15; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: env(safe-area-inset-top) 15px 40px 15px; }
        
        #loader { position: fixed; top: 0; left: 0; height: 3px; background: var(--accent); z-index: 5000; transition: width 0.4s; }

        /* Header & Search */
        header { margin-bottom: 25px; }
        .search-row { display: flex; gap: 8px; margin-bottom: 15px; }
        #search-input { flex: 1; background: var(--card); border: 1px solid var(--border); padding: 14px; border-radius: 18px; color: #fff; font-size: 0.9rem; }
        .btn-gps { background: var(--card); border: 1px solid var(--border); width: 50px; border-radius: 18px; color: white; cursor: pointer; }
        #search-results { position: absolute; width: calc(100% - 90px); background: #1a1a1a; border-radius: 15px; z-index: 4000; display: none; box-shadow: 0 10px 30px #000; }
        .search-item { padding: 12px; border-bottom: 1px solid #333; cursor: pointer; font-size: 0.85rem; }

        /* Clock Box */
        .clock-box { background: linear-gradient(145deg, #111, #000); border: 1px solid var(--border); padding: 20px; border-radius: 25px; margin-bottom: 20px; }
        .loc-main { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 10px; }
        .city-name { font-size: 1.2rem; font-weight: 800; color: var(--text); }
        .time-local { font-size: 1.8rem; font-weight: 800; color: var(--accent); }
        .time-italy { font-size: 0.75rem; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }

        /* Grid Meteo */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 18px; border-radius: 22px; cursor: help; }
        .label { font-size: 0.6rem; color: var(--dim); text-transform: uppercase; font-weight: 700; margin-bottom: 4px; display: block; }
        .val { font-size: 1.6rem; font-weight: 800; }
        .unit { font-size: 0.8rem; color: var(--dim); margin-left: 2px; }

        section h2 { font-size: 0.7rem; color: var(--dim); text-transform: uppercase; margin: 0 0 10px 5px; }
        .scroll-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
        .tile { flex: 0 0 100px; background: var(--card); border: 1px solid var(--border); padding: 12px; border-radius: 20px; text-align: center; }
        .t-head { font-size: 0.65rem; color: var(--dim); margin-bottom: 4px; }
        .t-val { font-size: 1rem; font-weight: 700; }
        .t-sub { font-size: 0.6rem; color: var(--accent); margin-top: 3px; }

        /* Modal */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); display: none; align-items: center; justify-content: center; z-index: 6000; padding: 25px; }
        .modal-content { background: #111; border: 1px solid #333; border-radius: 30px; padding: 30px; width: 100%; max-width: 400px; text-align: center; position: relative; }
        .m-close { position: absolute; top: 15px; right: 15px; background: #222; border: none; color: #fff; width: 30px; height: 30px; border-radius: 50%; }
    </style>
</head>
<body>

<div id="loader"></div>

<header>
    <div class="search-row">
        <input type="text" id="search-input" placeholder="Cerca città (es. Tokyo, New York...)" autocomplete="off">
        <button class="btn-gps" id="btn-gps">📍</button>
    </div>
    <div id="search-results"></div>

    <div class="clock-box">
        <div class="loc-main">
            <div>
                <b id="loc-status" style="font-size: 0.6rem; color: var(--accent); text-transform: uppercase;">Ora Locale</b>
                <div class="city-name" id="city-display">Località...</div>
            </div>
            <div class="time-local" id="local-time">--:--</div>
        </div>
        <div class="time-italy" id="italy-time">In Italia: --:--</div>
    </div>
</header>

<main class="grid">
    <div class="card" onclick="explain('temp')"><span class="label">Temperatura</span><div class="val"><span id="c-temp">--</span><span class="unit">°C</span></div></div>
    <div class="card" onclick="explain('feels')"><span class="label">Percepita</span><div class="val"><span id="c-feels">--</span><span class="unit">°C</span></div></div>
    <div class="card" onclick="explain('rain')"><span class="label">Pioggia</span><div class="val"><span id="c-rain">--</span><span class="unit">%</span></div></div>
    <div class="card" onclick="explain('uv')"><span class="label">Indice UV</span><div class="val" id="c-uv">--</div></div>
</main>

<section>
    <h2>Prossime Ore (Fuso Locale)</h2>
    <div class="scroll-row" id="h-row"></div>
</section>

<section>
    <h2>Tendenza 3 Giorni</h2>
    <div class="scroll-row" id="d-row"></div>
</section>

<div id="modal" class="modal" onclick="this.style.display='none'">
    <div class="modal-content" onclick="event.stopPropagation()">
        <button class="m-close" onclick="document.getElementById('modal').style.display='none'">✕</button>
        <h3 id="m-title" style="color:var(--accent); margin-bottom:15px;">INFO</h3>
        <p id="m-text" style="color:#ccc; line-height:1.5;"></p>
    </div>
</div>

<script>
    let db = null;
    let timerInterval = null;
    const loader = document.getElementById('loader');

    // --- GESTIONE ORARIO ---
    function updateClocks(timezone) {
        if (timerInterval) clearInterval(timerInterval);
        
        timerInterval = setInterval(() => {
            const now = new Date();
            
            // Ora Locale della città cercata
            const localStr = now.toLocaleTimeString('it-IT', { timeZone: timezone, hour: '2-digit', minute: '2-digit' });
            document.getElementById('local-time').innerText = localStr;
            
            // Ora Italiana
            const italyStr = now.toLocaleTimeString('it-IT', { timeZone: 'Europe/Rome', hour: '2-digit', minute: '2-digit' });
            document.getElementById('italy-time').innerText = `In Italia: ${italyStr}`;
        }, 1000);
    }

    // --- RICERCA ---
    const searchInput = document.getElementById('search-input');
    const resultsDiv = document.getElementById('search-results');

    searchInput.addEventListener('input', async () => {
        const q = searchInput.value;
        if (q.length < 3) { resultsDiv.style.display = 'none'; return; }
        
        const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=5&language=it`);
        const data = await res.json();
        
        if (data.results) {
            resultsDiv.innerHTML = data.results.map(r => `
                <div class="search-item" onclick="loadWeather(${r.latitude}, ${r.longitude}, '${r.name}', '${r.timezone}')">
                    ${r.name} (${r.country})
                </div>
            `).join('');
            resultsDiv.style.display = 'block';
        }
    });

    async function loadWeather(lat, lon, name, timezone) {
        resultsDiv.style.display = 'none';
        searchInput.value = '';
        loader.style.width = '50%';
        
        try {
            const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,precipitation_probability,uv_index,weather_code&hourly=temperature_2m,precipitation_probability&daily=temperature_2m_max,precipitation_probability_max&timezone=${encodeURIComponent(timezone)}`);
            db = await res.json();
            
            document.getElementById('city-display').innerText = name;
            renderMeteo();
            updateClocks(db.timezone);
            
            loader.style.width = '100%';
            setTimeout(() => loader.style.width = '0', 500);
        } catch(e) { alert("Errore connessione"); }
    }

    function renderMeteo() {
        const cur = db.current;
        document.getElementById('c-temp').innerText = Math.round(cur.temperature_2m);
        document.getElementById('c-feels').innerText = Math.round(cur.apparent_temperature);
        document.getElementById('c-rain').innerText = cur.precipitation_probability;
        document.getElementById('c-uv').innerText = cur.uv_index.toFixed(1);

        // Ore (calcolate sul fuso locale)
        const hRow = document.getElementById('h-row'); hRow.innerHTML = '';
        const now = new Date(db.current.time);
        const startHour = now.getHours();

        for(let i=1; i<=4; i++) {
            const hIdx = startHour + i;
            if(!db.hourly.temperature_2m[hIdx]) break;
            hRow.innerHTML += `
                <div class="tile">
                    <div class="t-head">${hIdx % 24}:00</div>
                    <div class="t-val">${Math.round(db.hourly.temperature_2m[hIdx])}°</div>
                    <div class="t-sub">💧${db.hourly.precipitation_probability[hIdx]}%</div>
                </div>`;
        }

        // Giorni
        const dRow = document.getElementById('d-row'); dRow.innerHTML = '';
        const labels = ['Oggi', 'Domani', 'Dopodomani'];
        for(let i=0; i<3; i++) {
            dRow.innerHTML += `
                <div class="tile">
                    <div class="t-head">${labels[i]}</div>
                    <div class="t-val">${Math.round(db.daily.temperature_2m_max[i])}°</div>
                    <div class="t-sub">💧${db.daily.precipitation_probability_max[i]}%</div>
                </div>`;
        }
    }

    document.getElementById('btn-gps').onclick = () => {
        navigator.geolocation.getCurrentPosition(p => {
            // Per il GPS usiamo 'auto' come fuso orario nell'API
            loadWeather(p.coords.latitude, p.coords.longitude, "Tua posizione", "auto");
        });
    };

    function explain(key) {
        const texts = {
            temp: "Temperatura reale dell'aria in questo momento.",
            feels: "Temperatura percepita (considera umidità e vento).",
            rain: "Probabilità di pioggia immediata.",
            uv: "Indice UV. Sopra 6 usa protezione solare."
        };
        document.getElementById('m-title').innerText = key.toUpperCase();
        document.getElementById('m-text').innerText = texts[key];
        document.getElementById('modal').style.display = 'flex';
    }

    window.onload = () => document.getElementById('btn-gps').click();
</script>
</body>
</html>
