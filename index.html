<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Honor Weather Sentinel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #000; --card: #121212; --accent: #3b82f6; --text: #fff; --dim: #888; 
            --border: rgba(255,255,255,0.08); --safe: #00e676; --warning: #facc15; --danger: #ff3b3b; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: env(safe-area-inset-top) 20px 40px; line-height: 1.4; }
        
        #loader { position: fixed; top: 0; left: 0; height: 3px; background: var(--accent); z-index: 10000; width: 0%; transition: width 0.3s; }

        /* Search Bar & Results */
        header { margin-bottom: 20px; position: relative; }
        .search-group { display: flex; gap: 10px; }
        #search-input { flex: 1; background: var(--card); border: 1px solid var(--border); padding: 14px 18px; border-radius: 20px; color: #fff; font-size: 0.9rem; }
        .btn-icon { background: var(--card); border: 1px solid var(--border); width: 52px; border-radius: 20px; color: white; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; cursor: pointer; }
        #results { position: absolute; top: 65px; left: 0; width: calc(100% - 62px); background: #1a1a1a; border-radius: 20px; z-index: 5000; display: none; border: 1px solid #333; overflow: hidden; }
        .res-item { padding: 14px; border-bottom: 1px solid #222; cursor: pointer; font-size: 0.85rem; }

        /* Allerte */
        #alert-box { display: none; background: rgba(255, 59, 59, 0.15); border: 1px solid var(--danger); color: var(--danger); padding: 12px; border-radius: 18px; margin-bottom: 20px; text-align: center; font-weight: 800; font-size: 0.75rem; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

        /* Hero UI */
        .hero { text-align: center; padding-bottom: 25px; }
        .loc-name { font-size: 1.2rem; font-weight: 800; letter-spacing: -0.5px; }
        .clock-row { font-size: 0.65rem; color: var(--dim); text-transform: uppercase; margin: 5px 0; letter-spacing: 1px; }
        .main-icon { width: 140px; height: 140px; margin: 10px auto; filter: drop-shadow(0 0 20px rgba(59,130,246,0.2)); }
        .temp-hero { font-size: 5.5rem; font-weight: 800; line-height: 1; letter-spacing: -4px; }
        .condition { color: var(--accent); font-weight: 700; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; margin-top: 10px; }

        /* Metrics Grid */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 28px; transition: transform 0.2s; }
        .card:active { transform: scale(0.96); }
        .card .label { font-size: 0.6rem; color: var(--dim); text-transform: uppercase; font-weight: 700; margin-bottom: 5px; display: block; }
        .card .val { font-size: 1.8rem; font-weight: 800; }
        .card .comp { font-size: 0.65rem; color: var(--accent); margin-top: 5px; font-weight: 600; display: block; }

        /* Advice Box */
        .advice { background: linear-gradient(145deg, #111, #000); border: 1px solid var(--border); padding: 20px; border-radius: 28px; display: flex; align-items: center; gap: 15px; margin-bottom: 30px; }
        .advice-icon { font-size: 2.2rem; }
        .advice-text b { font-size: 0.7rem; color: var(--warning); text-transform: uppercase; display: block; margin-bottom: 2px; }
        .advice-text p { font-size: 0.85rem; color: #ccc; line-height: 1.4; }

        /* Scroller */
        section h3 { font-size: 0.75rem; color: var(--dim); text-transform: uppercase; margin: 0 0 15px 5px; }
        .scroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
        .scroll::-webkit-scrollbar { display: none; }
        .tile { flex: 0 0 100px; background: var(--card); border: 1px solid var(--border); padding: 18px 10px; border-radius: 24px; text-align: center; cursor: pointer; }
        .tile.active { border-color: var(--accent); background: rgba(59, 130, 246, 0.1); }
        .tile img { width: 32px; height: 32px; margin: 8px 0; }
        .t-time { font-size: 0.65rem; color: var(--dim); }
        .t-temp { font-size: 1.1rem; font-weight: 700; }

        /* Modal */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(20px); display: none; align-items: center; justify-content: center; z-index: 10001; padding: 30px; }
        .modal-content { background: #111; border: 1px solid #333; border-radius: 35px; padding: 40px; width: 100%; max-width: 400px; text-align: center; }
    </style>
</head>
<body>

<div id="loader"></div>

<header>
    <div class="search-group">
        <input type="text" id="search-input" placeholder="Cerca città..." autocomplete="off">
        <button class="btn-icon" onclick="resetToHome()">📍</button>
    </div>
    <div id="results"></div>
</header>

<div id="alert-box">⚠️ ALLERTA GRANDINE RILEVATA</div>

<main class="hero">
    <div class="loc-name" id="city-name">Localizzazione...</div>
    <div class="clock-row">Locale: <span id="time-l">--:--</span> • Casa: <span id="time-h">--:--</span></div>
    <img id="m-icon" src="" class="main-icon" alt="">
    <div class="temp-hero"><span id="hero-t">--</span>°</div>
    <div class="condition" id="hero-desc">Sincronizzazione...</div>
</main>

<div class="grid">
    <div class="card" onclick="showInfo('feels')"><span class="label">Percepita</span><div class="val"><span id="c-feels">--</span>°</div><div class="comp" id="h-feels"></div></div>
    <div class="card" onclick="showInfo('rain')"><span class="label">Pioggia</span><div class="val"><span id="c-rain">--</span>%</div><div class="comp" id="h-rain"></div></div>
    <div class="card" onclick="showInfo('hum')"><span class="label">Umidità</span><div class="val"><span id="c-hum">--</span>%</div><div class="comp" id="h-hum"></div></div>
    <div class="card" onclick="showInfo('uv')"><span class="label">Indice UV</span><div class="val" id="c-uv">--</div><div class="comp" id="h-uv"></div></div>
</div>

<div class="advice">
    <div class="advice-icon" id="adv-i">👕</div>
    <div class="advice-text">
        <b>Outfit Consigliato</b>
        <p id="adv-t">Sto calcolando l'abbigliamento perfetto per il meteo attuale...</p>
    </div>
</div>

<section>
    <h3>Prossime 8 Ore (Tocca per dati)</h3>
    <div class="scroll" id="h-row"></div>
</section>

<section>
    <h3>Tendenza Settimana</h3>
    <div class="scroll" id="d-row"></div>
</section>

<div id="modal" class="modal" onclick="this.style.display='none'">
    <div class="modal-content">
        <h3 id="m-title" style="color:var(--accent); margin-bottom:15px; text-transform:uppercase;">Dettaglio</h3>
        <p id="m-text" style="color:#ccc; line-height:1.6;"></p>
    </div>
</div>

<script>
    let homeData = null;
    let activeData = null;
    let timer = null;

    const wMap = {
        0: ["Sereno", "sun"], 1: ["Quasi Sereno", "cloud-sun"], 2: ["Nubi Sparse", "cloud-sun"],
        3: ["Coperto", "cloud"], 45: ["Nebbia", "cloud-fog"], 51: ["Pioviggine", "cloud-drizzle"], 61: ["Pioggia", "cloud-rain"],
        63: ["Pioggia", "cloud-rain"], 65: ["Pioggia Forte", "cloud-showers-heavy"], 95: ["Temporale", "cloud-lightning"],
        27: ["Grandine", "cloud-hail"], 87: ["Grandine", "cloud-hail"], 99: ["Temporale+Grandine", "cloud-hail"]
    };

    // --- CARICAMENTO TURBO ---
    async function turboInit() {
        document.getElementById('loader').style.width = '30%';
        try {
            // IP Fallback rapido
            const ip = await fetch('https://ipapi.co/json/').then(r => r.json());
            await fetchWeather(ip.latitude, ip.longitude, ip.city, "auto", true);
            
            // GPS in background
            navigator.geolocation.getCurrentPosition(p => {
                fetchWeather(p.coords.latitude, p.coords.longitude, "Casa", "auto", true);
            });
        } catch(e) { resetToHome(); }
    }

    async function fetchWeather(lat, lon, name, tz, isHome) {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,precipitation_probability,relative_humidity_2m,uv_index,weather_code&hourly=temperature_2m,apparent_temperature,precipitation_probability,relative_humidity_2m,weather_code&daily=temperature_2m_max,weather_code&timezone=${encodeURIComponent(tz)}`;
        const res = await fetch(url).then(r => r.json());
        if(isHome) homeData = res;
        activeData = res;
        renderUI(name, isHome);
    }

    function getIcon(code) {
        // Usiamo icone SVG da un CDN molto affidabile
        const map = { 
            0: "sun", 1: "cloud-sun", 2: "cloud-sun", 3: "cloud", 45: "cloud-fog", 
            51: "cloud-drizzle", 61: "cloud-rain", 63: "cloud-rain", 65: "cloud-showers-heavy", 
            95: "cloud-lightning", 27: "cloud-hail", 87: "cloud-hail", 99: "cloud-hail" 
        };
        const icon = map[code] || "cloud";
        return `https://raw.githubusercontent.com/lucide-icons/lucide/main/icons/${icon}.svg`;
    }

    function renderUI(name, isHome) {
        const c = activeData.current;
        document.getElementById('city-name').innerText = name;
        document.getElementById('hero-t').innerText = Math.round(c.temperature_2m);
        document.getElementById('c-feels').innerText = Math.round(c.apparent_temperature);
        document.getElementById('c-rain').innerText = c.precipitation_probability;
        document.getElementById('c-hum').innerText = c.relative_humidity_2m;
        document.getElementById('c-uv').innerText = c.uv_index;

        const info = wMap[c.weather_code] || ["Nuvoloso", "cloud"];
        document.getElementById('hero-desc').innerText = info[0];
        document.getElementById('m-icon').src = getIcon(c.weather_code);
        document.getElementById('m-icon').style.filter = "invert(1) sepia(1) saturate(5) hue-rotate(190deg)"; // Rende l'SVG blu accent

        // Allerta
        const alert = document.getElementById('alert-box');
        if([27, 87, 99].includes(c.weather_code)) {
            alert.innerText = "⚠️ PERICOLO GRANDINE RILEVATO";
            alert.style.display = 'block';
        } else { alert.style.display = 'none'; }

        // Confronto
        if(!isHome && homeData) {
            document.getElementById('h-feels').innerText = `Casa: ${Math.round(homeData.current.apparent_temperature)}°`;
            document.getElementById('h-rain').innerText = `Casa: ${homeData.current.precipitation_probability}%`;
            document.getElementById('h-hum').innerText = `Casa: ${homeData.current.relative_humidity_2m}%`;
            document.getElementById('h-uv').innerText = `Casa: ${homeData.current.uv_index}`;
        } else {
            document.querySelectorAll('.comp').forEach(e => e.innerText = "");
        }

        updateClocks(activeData.timezone);
        updateAdvice(c);
        renderForecasts();
        document.getElementById('loader').style.width = '100%';
        setTimeout(() => document.getElementById('loader').style.width = '0', 400);
    }

    function renderForecasts() {
        const hRow = document.getElementById('h-row'); hRow.innerHTML = '';
        const dRow = document.getElementById('d-row'); dRow.innerHTML = '';
        const now = new Date().getHours();

        for(let i=1; i<=8; i++) {
            const idx = now + i;
            const code = activeData.hourly.weather_code[idx];
            hRow.innerHTML += `<div class="tile" onclick="interactiveForecast(${idx})">
                <div class="t-time">${idx%24}:00</div>
                <img src="${getIcon(code)}" style="filter:invert(1)">
                <div class="t-temp">${Math.round(activeData.hourly.temperature_2m[idx])}°</div>
            </div>`;
        }

        const days = ['Dom', 'Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab'];
        for(let i=1; i<=7; i++) {
            const d = new Date(); d.setDate(d.getDate() + i);
            const code = activeData.daily.weather_code[i];
            dRow.innerHTML += `<div class="tile">
                <div class="t-time">${days[d.getDay()]}</div>
                <img src="${getIcon(code)}" style="filter:invert(1)">
                <div class="t-temp">${Math.round(activeData.daily.temperature_2m_max[i])}°</div>
            </div>`;
        }
    }

    function interactiveForecast(idx) {
        const h = activeData.hourly;
        document.getElementById('hero-t').innerText = Math.round(h.temperature_2m[idx]);
        document.getElementById('c-feels').innerText = Math.round(h.apparent_temperature[idx]);
        document.getElementById('c-rain').innerText = h.precipitation_probability[idx];
        document.getElementById('c-hum').innerText = h.relative_humidity_2m[idx];
        document.getElementById('hero-desc').innerText = "Previsione ore " + (idx % 24) + ":00";
    }

    function updateAdvice(c) {
        let t = "Clima mite. Abbigliamento leggero."; let i = "👕";
        if (c.temperature_2m > 26) { t = "Caldo intenso. T-shirt e idratazione."; i = "🩳"; }
        if (c.temperature_2m < 15) { t = "Fresco. Meglio una giacca."; i = "🧥"; }
        if (c.precipitation_probability > 40) t += " Ombrello consigliato.";
        document.getElementById('adv-t').innerText = t;
        document.getElementById('adv-i').innerText = i;
    }

    function updateClocks(tz) {
        if(timer) clearInterval(timer);
        timer = setInterval(() => {
            const n = new Date();
            document.getElementById('time-l').innerText = n.toLocaleTimeString('it-IT', {timeZone: tz, hour:'2-digit', minute:'2-digit'});
            document.getElementById('time-h').innerText = n.toLocaleTimeString('it-IT', {timeZone:'Europe/Rome', hour:'2-digit', minute:'2-digit'});
        }, 1000);
    }

    // Ricerca
    const sIn = document.getElementById('search-input');
    const sRes = document.getElementById('results');
    sIn.addEventListener('input', async () => {
        if(sIn.value.length < 3) return sRes.style.display = 'none';
        const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(sIn.value)}&count=5&language=it`).then(res => res.json());
        if(r.results) {
            sRes.innerHTML = r.results.map(c => `<div class="res-item" onclick="fetchWeather(${c.latitude},${c.longitude},'${c.name}','${c.timezone}',false); document.getElementById('results').style.display='none';">${c.name} (${c.country})</div>`).join('');
            sRes.style.display = 'block';
        }
    });

    function resetToHome() {
        if(homeData) renderUI("Casa", true);
        else turboInit();
    }

    function showInfo(k) {
        const d = { feels: "Temp avvertita sulla pelle.", rain: "Possibilità di pioggia.", hum: "Umidità aria.", uv: "Raggi solari." };
        document.getElementById('m-title').innerText = k;
        document.getElementById('m-text').innerText = d[k];
        document.getElementById('modal').style.display = 'flex';
    }

    window.onload = turboInit;
</script>
</body>
</html>
