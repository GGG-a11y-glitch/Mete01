<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Honor Weather Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #000000;
            --card: rgba(25, 25, 25, 0.8);
            --accent: #3b82f6;
            --danger: #ff4b4b;
            --safe: #00e676;
            --text: #ffffff;
            --dim: #999999;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding: env(safe-area-inset-top) 15px 40px 15px;
            overflow-x: hidden;
        }

        /* Progress Bar */
        #loader {
            position: fixed; top: 0; left: 0; width: 0%; height: 3px;
            background: linear-gradient(90deg, var(--accent), #60a5fa);
            z-index: 1000; transition: width 0.3s;
        }

        /* Header e Mappe */
        header { margin: 20px 0 30px 0; }
        .location-box {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 18px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white;
            transition: transform 0.2s;
            backdrop-filter: blur(10px);
        }
        .location-box:active { transform: scale(0.98); background: rgba(255,255,255,0.05); }
        .loc-icon { font-size: 1.5rem; }
        .loc-info b { display: block; font-size: 0.7rem; color: var(--accent); text-transform: uppercase; margin-bottom: 2px; }
        .loc-info span { font-size: 0.95rem; font-weight: 500; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 250px; }

        /* Grid Principale 2x2 */
        .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 22px 18px;
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .card .label { font-size: 0.7rem; color: var(--dim); text-transform: uppercase; font-weight: 600; margin-bottom: 8px; letter-spacing: 0.5px; }
        .card .val { font-size: 2rem; font-weight: 800; letter-spacing: -1px; }
        .card .unit { font-size: 1rem; color: var(--dim); font-weight: 400; margin-left: 2px; }
        .card .note { font-size: 0.65rem; margin-top: 10px; font-weight: 600; padding: 4px 0; }

        /* Section Titles */
        section h2 { font-size: 0.8rem; color: var(--dim); text-transform: uppercase; margin: 0 0 15px 5px; letter-spacing: 1.5px; }

        /* Row Scorrevole Tiles */
        .scroll-row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
        .scroll-row::-webkit-scrollbar { display: none; }

        .tile {
            flex: 0 0 110px;
            background: var(--card);
            border: 1px solid var(--border);
            padding: 18px 10px;
            border-radius: 24px;
            text-align: center;
            transition: all 0.2s;
        }
        .tile:active { transform: scale(0.92); border-color: var(--accent); }
        .tile .t-time { font-size: 0.75rem; color: var(--dim); margin-bottom: 8px; }
        .tile .t-temp { font-size: 1.2rem; font-weight: 700; }
        .tile .t-rain { font-size: 0.7rem; color: var(--accent); margin-top: 5px; font-weight: 600; }

        /* Eventi Critici */
        .event-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .event-card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 24px; text-align: center; }
        .event-card i { font-size: 0.65rem; color: var(--dim); text-transform: uppercase; display: block; margin-bottom: 5px; }
        .event-card b { font-size: 1.1rem; color: #facc15; }

        /* Modal Dettagli */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(15px);
            display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px;
        }
        .modal-content {
            background: #151515; width: 100%; max-width: 400px;
            border-radius: 35px; border: 1px solid #333; padding: 35px;
            position: relative; animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes pop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-close { position: absolute; top: 20px; right: 20px; color: var(--dim); font-size: 1.5rem; background: none; border: none; }

        /* Errore UI */
        #error-msg { 
            display: none; background: var(--danger); color: white; 
            padding: 15px; border-radius: 15px; margin-top: 20px; text-align: center; font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div id="loader"></div>

    <header>
        <a id="maps-btn" href="#" target="_blank" class="location-box">
            <div class="loc-icon">📍</div>
            <div class="loc-info">
                <b>Posizione Rilevata</b>
                <span id="loc-name">Ricerca posizione...</span>
            </div>
        </a>
        <div id="error-msg"></div>
    </header>

    <main class="main-grid">
        <div class="card">
            <span class="label">Temperatura</span>
            <div class="val"><span id="c-temp">--</span><span class="unit">°C</span></div>
        </div>
        <div class="card">
            <span class="label">Percepita</span>
            <div class="val"><span id="c-feels">--</span><span class="unit">°C</span></div>
        </div>
        <div class="card">
            <span class="label">Prob. Pioggia</span>
            <div class="val"><span id="c-rain">--</span><span class="unit">%</span></div>
        </div>
        <div class="card">
            <span class="label">Indice UV</span>
            <div class="val" id="c-uv">--</div>
            <div id="c-uv-note" class="note">--</div>
        </div>
    </main>

    <section>
        <h2>Prossime 3 Ore <span style="font-size: 0.6rem; opacity: 0.5;">(Tocca tile)</span></h2>
        <div class="scroll-row" id="hourly-list">
            <!-- JS Injection -->
        </div>
    </section>

    <section>
        <h2>Tendenza 3 Giorni</h2>
        <div class="scroll-row" id="daily-list">
            <!-- JS Injection -->
        </div>
    </section>

    <section>
        <h2>Allerta Eventi</h2>
        <div class="event-grid">
            <div class="event-card"><i>Grandine</i><b id="e-hail">--</b></div>
            <div class="event-card"><i>Vento Max</i><b id="e-wind">--</b></div>
        </div>
    </section>

    <!-- Modal Orario -->
    <div id="detail-modal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <h3 id="m-title" style="margin-bottom: 25px; color: var(--accent); font-size: 1.4rem;">Dettaglio</h3>
            <div class="main-grid" style="margin-bottom: 0;">
                <div class="card"><span class="label">Temp</span><div class="val"><span id="m-temp">--</span><span class="unit">°C</span></div></div>
                <div class="card"><span class="label">Percepita</span><div class="val"><span id="m-feels">--</span><span class="unit">°C</span></div></div>
                <div class="card"><span class="label">Pioggia</span><div class="val"><span id="m-rain">--</span><span class="unit">%</span></div></div>
                <div class="card"><span class="label">UV</span><div class="val" id="m-uv">--</div></div>
            </div>
        </div>
    </div>

    <script>
        let weatherStore = null;

        async function startApp() {
            const loader = document.getElementById('loader');
            const errBox = document.getElementById('error-msg');
            loader.style.width = '30%';
            errBox.style.display = 'none';

            if (!navigator.geolocation) {
                showError("Il tuo telefono non supporta il GPS nel browser.");
                return;
            }

            navigator.geolocation.getCurrentPosition(async (pos) => {
                loader.style.width = '60%';
                const { latitude: lat, longitude: lon } = pos.coords;

                // 1. Google Maps Link
                document.getElementById('maps-btn').href = `https://www.google.com/maps?q=${lat},${lon}`;

                try {
                    // 2. Fetch Meteo (Priorità 1)
                    const wRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,precipitation_probability,uv_index,weather_code&hourly=temperature_2m,apparent_temperature,precipitation_probability,uv_index,wind_gusts_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto`);
                    weatherStore = await wRes.json();
                    
                    // 3. Fetch Indirizzo (Priorità 2)
                    const gRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                    const gData = await gRes.json();
                    const addr = gData.address;
                    document.getElementById('loc-name').innerText = `${addr.road || ''} ${addr.house_number || ''}, ${addr.city || addr.town || ''}`;

                    renderData();
                    loader.style.width = '100%';
                    setTimeout(() => loader.style.width = '0%', 400);

                } catch (e) {
                    showError("Errore connessione dati. Riprova tra poco.");
                }
            }, (err) => {
                showError("GPS non trovato. Attiva la posizione e autorizza Chrome.");
            }, { timeout: 10000, enableHighAccuracy: true });
        }

        function renderData() {
            const c = weatherStore.current;
            
            // Correnti
            document.getElementById('c-temp').innerText = Math.round(c.temperature_2m);
            document.getElementById('c-feels').innerText = Math.round(c.apparent_temperature);
            document.getElementById('c-rain').innerText = c.precipitation_probability;
            document.getElementById('c-uv').innerText = c.uv_index.toFixed(1);

            const uvNote = document.getElementById('c-uv-note');
            if (c.uv_index >= 6) {
                uvNote.innerText = `DANNOSO: Max ${Math.round(200/c.uv_index)} min sole`;
                uvNote.style.color = 'var(--danger)';
            } else {
                uvNote.innerText = "SICURO: Esposizione libera";
                uvNote.style.color = 'var(--safe)';
            }

            // Orario (Next 3h)
            const hList = document.getElementById('hourly-list');
            hList.innerHTML = '';
            const nowH = new Date().getHours();
            for(let i=1; i<=3; i++) {
                const idx = nowH + i;
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.onclick = () => openModal(idx);
                tile.innerHTML = `
                    <div class="t-time">${idx}:00</div>
                    <div class="t-temp">${Math.round(weatherStore.hourly.temperature_2m[idx])}°</div>
                    <div class="t-rain">💧${weatherStore.hourly.precipitation_probability[idx]}%</div>
                `;
                hList.appendChild(tile);
            }

            // Giornaliero
            const dList = document.getElementById('daily-list');
            dList.innerHTML = '';
            const days = ['Oggi', 'Domani', 'Dopodomani'];
            for(let i=0; i<3; i++) {
                dList.innerHTML += `
                    <div class="tile">
                        <div class="t-time">${days[i]}</div>
                        <div class="t-temp">${Math.round(weatherStore.daily.temperature_2m_max[i])}°</div>
                        <div class="t-rain">💧${weatherStore.daily.precipitation_probability_max[i]}%</div>
                    </div>
                `;
            }

            // Eventi
            const hailCodes = [27, 87, 88, 89, 90, 99];
            document.getElementById('e-hail').innerText = hailCodes.includes(c.weather_code) ? "ALTA" : "Bassa";
            
            const maxWind = Math.max(...weatherStore.hourly.wind_gusts_10m.slice(0, 24));
            document.getElementById('e-wind').innerText = `${Math.round(maxWind)} km/h`;
        }

        function openModal(idx) {
            const h = weatherStore.hourly;
            document.getElementById('m-title').innerText = `Dettaglio ore ${idx}:00`;
            document.getElementById('m-temp').innerText = Math.round(h.temperature_2m[idx]);
            document.getElementById('m-feels').innerText = Math.round(h.apparent_temperature[idx]);
            document.getElementById('m-rain').innerText = h.precipitation_probability[idx];
            document.getElementById('m-uv').innerText = h.uv_index[idx].toFixed(1);
            document.getElementById('detail-modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('detail-modal').style.display = 'none'; }

        function showError(txt) {
            const errBox = document.getElementById('error-msg');
            errBox.innerText = txt;
            errBox.style.display = 'block';
            document.getElementById('loc-name').innerText = "Errore GPS";
        }

        window.onload = startApp;
        document.addEventListener("visibilitychange", () => { if (!document.hidden) startApp(); });
    </script>
</body>
</html>
