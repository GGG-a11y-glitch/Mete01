<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>Honor Weather Ultra</title>
    <style>
        :root { 
            --bg: #000; --card: #121212; --accent: #3b82f6; --danger: #ef4444; 
            --safe: #10b981; --text: #fff; --dim: #888; --glass: rgba(255,255,255,0.03);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { 
            background: var(--bg); color: var(--text); 
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px; line-height: 1.5; overflow-x: hidden;
        }

        /* Header e Link Mappe */
        header { margin-bottom: 25px; }
        .location-link { 
            text-decoration: none; color: inherit; display: block;
            padding: 12px; background: var(--glass); border-radius: 15px;
            border: 1px solid #222; transition: background 0.2s;
        }
        .location-link:active { background: rgba(255,255,255,0.1); }
        .addr-line { font-size: 0.85rem; display: flex; align-items: center; gap: 8px; }
        .addr-line b { color: var(--accent); font-size: 0.7rem; text-transform: uppercase; white-space: nowrap; }
        .addr-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* Grid Principale */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px; }
        .card { 
            background: var(--card); padding: 18px; border-radius: 24px; 
            border: 1px solid #1a1a1a; position: relative;
        }
        .card .label { font-size: 0.65rem; color: var(--dim); text-transform: uppercase; margin-bottom: 6px; display: block; }
        .card .val { font-size: 1.8rem; font-weight: 800; letter-spacing: -1px; }
        .card .unit { font-size: 0.9rem; color: var(--dim); font-weight: 400; margin-left: 2px; }
        .card .note { font-size: 0.65rem; margin-top: 10px; font-weight: 500; }

        /* Sezioni Forecast */
        section { margin-bottom: 25px; }
        h2 { font-size: 0.75rem; color: var(--dim); text-transform: uppercase; margin-bottom: 12px; letter-spacing: 1px; padding-left: 5px; }
        .scroll-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .scroll-row::-webkit-scrollbar { display: none; }
        
        .tile { 
            flex: 0 0 100px; background: var(--card); padding: 15px; 
            border-radius: 20px; text-align: center; border: 1px solid #1a1a1a;
            cursor: pointer; transition: transform 0.1s;
        }
        .tile:active { transform: scale(0.95); background: #1a1a1a; }
        .tile .t-head { font-size: 0.7rem; color: var(--dim); margin-bottom: 8px; }
        .tile .t-val { font-size: 1.1rem; font-weight: 700; }
        .tile .t-sub { font-size: 0.65rem; color: var(--accent); margin-top: 5px; }

        /* Eventi Card */
        .event-card { 
            background: linear-gradient(145deg, #121212, #000); 
            border: 1px solid #222; padding: 20px; border-radius: 24px;
            display: flex; justify-content: space-around;
        }
        .event-item { text-align: center; flex: 1; }
        .event-item:first-child { border-right: 1px solid #222; }
        .e-label { font-size: 0.6rem; color: var(--dim); text-transform: uppercase; margin-bottom: 5px; }
        .e-val { font-size: 1.1rem; font-weight: 700; color: #facc15; }

        /* MODAL (Dettaglio Orario) */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(10px);
            z-index: 100; display: none; align-items: center; justify-content: center;
            padding: 20px;
        }
        .modal-content {
            background: var(--card); width: 100%; max-width: 400px;
            border-radius: 32px; border: 1px solid #333; padding: 30px;
            position: relative; animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .close-modal { 
            position: absolute; top: 20px; right: 20px; background: #222;
            border: none; color: #fff; width: 30px; height: 30px; border-radius: 50%;
        }

        .loading-overlay {
            position: fixed; top:0; left:0; width:100%; height:3px;
            background: var(--accent); z-index: 1000; display: none;
        }
        .active-loading .loading-overlay { display: block; animation: load 2s infinite; }
        @keyframes load { 0% { width: 0; left: 0; } 50% { width: 100%; left: 0; } 100% { width: 0; left: 100%; } }
    </style>
</head>
<body>

    <div class="loading-overlay"></div>

    <header>
        <a id="maps-link" href="#" target="_blank" class="location-link">
            <div class="addr-line">
                <b>📍 Posizione rilevata</b>
                <span id="addr-text" class="addr-text">Ricerca...</span>
            </div>
        </a>
    </header>

    <main class="grid">
        <div class="card">
            <span class="label">Temperatura</span>
            <div class="val"><span id="curr-temp">--</span><span class="unit">°C</span></div>
        </div>
        <div class="card">
            <span class="label">Percepita</span>
            <div class="val"><span id="curr-feels">--</span><span class="unit">°C</span></div>
        </div>
        <div class="card">
            <span class="label">Prob. Pioggia</span>
            <div class="val"><span id="curr-rain">--</span><span class="unit">%</span></div>
        </div>
        <div class="card">
            <span class="label">Indice UV</span>
            <div class="val" id="curr-uv">--</div>
            <div id="uv-note" class="note">--</div>
        </div>
    </main>

    <section>
        <h2>Dettaglio Prossime Ore (Tocca per info)</h2>
        <div class="scroll-row" id="hourly-row">
            <!-- Tiles generate via JS -->
        </div>
    </section>

    <section>
        <h2>Tendenza 3 Giorni</h2>
        <div class="scroll-row" id="daily-row">
            <!-- Tiles generate via JS -->
        </div>
    </section>

    <section>
        <h2>Eventi Critici a breve</h2>
        <div class="event-card">
            <div class="event-item">
                <div class="e-label">Grandine</div>
                <div class="e-val" id="hail-val">Bassa</div>
            </div>
            <div class="event-item">
                <div class="e-label">Raffica Vento</div>
                <div class="e-val" id="wind-val">--</div>
            </div>
        </div>
    </section>

    <!-- Modal Dettagli Orari -->
    <div id="hour-modal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-modal" onclick="closeModal()">✕</button>
            <h3 id="m-title" style="margin-bottom: 20px; color: var(--accent);">Orario</h3>
            <div class="grid" style="margin-bottom: 0;">
                <div class="card">
                    <span class="label">Temp.</span>
                    <div class="val"><span id="m-temp">--</span
